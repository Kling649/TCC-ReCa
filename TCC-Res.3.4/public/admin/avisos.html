<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Avisos — Área da nutricionista</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando" data-area="admin">
  <main class="container">
    <div class="cabecalho-pagina">
      <h1>Avisos</h1>
      <p class="subtitulo">Publique comunicados para os alunos</p>
    </div>

    <section class="cartao coluna-estreita" aria-labelledby="t-novo">
      <h2 id="t-novo">Publicar um aviso</h2>
      <form class="formulario" id="form-aviso" novalidate style="margin-top:12px">
        <div class="campo" id="campo-texto">
          <label for="texto">Texto do aviso</label>
          <textarea id="texto" maxlength="500" placeholder="Escreva o comunicado de forma clara e objetiva"></textarea>
          <span class="ajuda" id="contador">0 / 500 caracteres</span>
          <span class="erro-campo" data-erro-para="texto" hidden></span>
        </div>

        <div class="campo">
          <span class="rotulo" id="rotulo-tipo">Tipo</span>
          <div class="segmentos" role="group" aria-labelledby="rotulo-tipo" style="grid-template-columns:repeat(3,1fr)">
            <button type="button" class="segmento" data-tipo="Informativo" aria-pressed="true">Informativo</button>
            <button type="button" class="segmento" data-tipo="Importante" aria-pressed="false">Importante</button>
            <button type="button" class="segmento" data-tipo="Urgente" aria-pressed="false">Urgente</button>
          </div>
        </div>

        <div class="campo">
          <label for="expiracao">Quando deixar de aparecer?</label>
          <select id="expiracao">
            <option value="nunca">Não expira (só quando eu encerrar)</option>
            <option value="1">Em 1 dia</option>
            <option value="3">Em 3 dias</option>
            <option value="7">Em 7 dias</option>
            <option value="fim-semana">Até sexta-feira (fim da semana)</option>
          </select>
        </div>

        <div class="acoes-form"><button type="submit" class="btn btn-grande" id="btn-publicar">Publicar aviso</button></div>
      </form>
    </section>

    <section class="secao" aria-labelledby="t-lista">
      <h2 class="secao-titulo" id="t-lista">Avisos publicados</h2>
      <div class="lista-avisos" id="lista"><p class="carregando-texto">Carregando…</p></div>
    </section>
  </main>
  <script src="/js/comum.js" defer></script>
  <script src="/js/admin-avisos.js" defer></script>
</body>
</html>
