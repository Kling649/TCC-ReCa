<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel — Área da nutricionista</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando" data-area="admin">
  <main class="container">
    <div class="cabecalho-pagina">
      <h1>Painel da nutricionista</h1>
      <p class="subtitulo" id="rotulo-semana">Restaurante IFRJ Campus Pinheiral</p>
    </div>

    <section aria-labelledby="t-indicadores">
      <h2 class="secao-titulo" id="t-indicadores">Visão geral da semana</h2>
      <div class="indicadores" id="indicadores">
        <p class="carregando-texto">Carregando…</p>
      </div>
    </section>

    <section class="secao" aria-labelledby="t-pendencias">
      <h2 class="secao-titulo" id="t-pendencias">Contagem</h2>
      <div class="cartao" id="pendencias"><p class="carregando-texto">Carregando…</p></div>
    </section>

    <section class="secao" aria-labelledby="t-cardapio">
      <h2 class="secao-titulo">
        <span id="t-cardapio">Cardápio da semana</span>
        <a class="btn btn-pequeno" href="/admin/cardapio.html">Editar cardápio</a>
      </h2>
      <div class="grade-dias" id="cardapio-resumo"><p class="carregando-texto">Carregando…</p></div>
    </section>

    <section class="secao" aria-labelledby="t-atalhos">
      <h2 class="secao-titulo" id="t-atalhos">Ações rápidas</h2>
      <div class="acoes-linha">
        <a class="btn" href="/admin/contagem.html">Registrar contagem</a>
        <a class="btn btn-secundario" href="/admin/presencas.html">Ver presenças</a>
        <a class="btn btn-secundario" href="/admin/prato.html">Cadastrar prato</a>
        <a class="btn btn-secundario" href="/admin/avisos.html">Publicar aviso</a>
        <a class="btn btn-secundario" href="/admin/comentarios.html">Comentários recebidos</a>
        <a class="btn btn-secundario" href="/admin/formularios.html">Restrições alimentares</a>
      </div>
    </section>
  </main>
  <script src="/js/comum.js" defer></script>
  <script src="/js/admin-painel.js" defer></script>
</body>
</html>
