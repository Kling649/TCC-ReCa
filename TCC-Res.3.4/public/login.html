<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar — Restaurante IFRJ Campus Pinheiral</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="carregando" data-area="publica">
  <main class="container">
    <div class="cabecalho-pagina">
      <h1>Entrar</h1>
      <p class="subtitulo">Acesse sua conta de aluno ou da nutricionista</p>
    </div>

    <section class="cartao janela-login" aria-labelledby="titulo-login">
      <h2 class="sr-only" id="titulo-login">Dados de acesso</h2>
      <div class="mensagem sucesso" id="msg-cadastrado" hidden>Conta criada com sucesso! Agora é só entrar.</div>
      <form class="formulario" id="form-login" novalidate style="margin-top:12px">
        <div class="campo" id="campo-email">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com">
          <span class="erro-campo" data-erro-para="email" hidden></span>
        </div>
        <div class="campo" id="campo-senha">
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
          <span class="erro-campo" data-erro-para="senha" hidden></span>
        </div>
        <div class="mensagem erro" id="msg-erro" hidden></div>
        <div class="acoes-form">
          <button type="submit" class="btn btn-grande btn-bloco" id="btn-entrar">Entrar</button>
        </div>
      </form>
      <p class="rodape-form nota">Não tem uma conta? <a href="/cadastro.html">Cadastre-se</a></p>
    </section>
  </main>
  <script src="/js/comum.js" defer></script>
  <script src="/js/auth.js" defer></script>
</body>
</html>
